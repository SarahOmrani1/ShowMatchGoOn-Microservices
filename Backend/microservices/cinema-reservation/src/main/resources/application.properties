spring.application.name=cinema-reservation
server.port=8085
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:showmatch}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:showmatch-local}
spring.mongodb.uri=mongodb://localhost:27017/cinema_db
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}

