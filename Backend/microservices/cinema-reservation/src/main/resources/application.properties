spring.application.name=cinema-reservation
server.port=8085
spring.data.mongodb.uri=mongodb://localhost:27017/cinema_db
spring.data.mongodb.database=cinema_db
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
