spring.application.name=subscription-loyalty
server.port=8083
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:showmatch}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:showmatch-local}
spring.mongodb.uri=mongodb://127.0.0.1:27017/subscription_db
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Subscription and loyalty microservice

