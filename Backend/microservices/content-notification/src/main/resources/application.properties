spring.application.name=content-notification
server.port=8082
spring.mongodb.uri=mongodb://localhost:27017/content_db
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}

# Content lifecycle scheduler (publishes SCHEDULED content, archives expired content)
app.content.scheduler.enabled=true
app.content.scheduler.cron=0/15 * * * * *

# AI recommendation service (falls back to local scoring when unreachable)
app.ai.recommendation-base-url=http://localhost:5055

# Notifications: unread notifications are emailed after a delay
app.notifications.email-fallback-enabled=true
app.notifications.email-fallback-delay-seconds=${EMAIL_FALLBACK_DELAY_SECONDS:20}
app.notifications.email-fallback-check-interval-ms=10000
app.notifications.email-from=${SMTP_FROM:${SMTP_USERNAME:no-reply@smgo.local}}

# SMTP: set SMTP_USERNAME and SMTP_PASSWORD (e.g. a Gmail app password) as environment variables
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
