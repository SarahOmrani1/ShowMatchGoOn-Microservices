spring.application.name=forum-promotion
server.port=8086
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:showmatch}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:showmatch-local}
spring.mongodb.uri=mongodb://localhost:27017/forum_db
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}

