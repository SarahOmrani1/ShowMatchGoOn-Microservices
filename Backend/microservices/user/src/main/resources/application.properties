spring.application.name=user
server.port=8081
# Configuration MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000



# Redirection du lien Eureka directement vers Swagger UI
eureka.instance.status-page-url-path=/swagger-ui/index.html
eureka.instance.home-page-url-path=/swagger-ui/index.html


